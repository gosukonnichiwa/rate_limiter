global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rate-limiter'
    static_configs:
      - targets: ['app:8080']
        labels:
          service: 'rate-limiter'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis-exporter'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']